on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Select target device (choose R4SE for NanoPi R4SE)'
        required: true
        type: choice
        default: R4SE
        options:
          - R4SE
          - X86
          - WRT32X
          - AXT1800
          - SF1200
          - SFT1200
      package:
        description: 'Package preset (tailscale uses the SDK feed)'
        required: true
        type: choice
        default: tailscale
        options:
          - tailscale
          - custom
      sourcecode:
        description: 'Custom package source URL(s); leave empty for tailscale'
        required: false
      pkgname:
        description: 'Custom OpenWrt package name(s); leave empty for tailscale'
        required: false
      sdk_url:
        description: 'Optional exact SDK URL for R4SE (tar.xz/tar.zst/tgz)'
        required: false
      sdk_sha256:
        description: 'Optional SHA256 for the custom R4SE SDK'
        required: false
      email:
        description: 'Git account email address'
        required: false
      password:
        description: 'Git account password'
        required: false

jobs:
  setpackage:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: build ipk
        id: build
        env:
          SOURCECODEURL: ${{ github.event.inputs.sourcecode }}
          PKGNAME: ${{ github.event.inputs.pkgname }}
          PACKAGE_PRESET: ${{ github.event.inputs.package }}
          BOARD: ${{ github.event.inputs.device }}
          SDK_URL: ${{ github.event.inputs.sdk_url }}
          SDK_SHA256: ${{ github.event.inputs.sdk_sha256 }}
          EMAIL: ${{ github.event.inputs.email }}
          PASSWORD: ${{ github.event.inputs.password }}
        run: |
          cd "$GITHUB_WORKSPACE"
          chmod +x ./build.sh
          ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.device }}_${{ github.event.inputs.package }}_related_ipks
          if-no-files-found: error
          path: |
            ./ipk-output/*.ipk
